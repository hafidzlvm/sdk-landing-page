services:
  landing-page-nginx:
    image: nginx:alpine
    container_name: landing-page-nginx
    restart: unless-stopped 
    environment:
      - VIRTUAL_HOST=${LANDING_PAGE_DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${LANDING_PAGE_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CORS_ALLOWED_DOMAIN=${CORS_ALLOWED_DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - sdk-landing-page
    networks:
      - solusi-digital-khatulistiwa

  sdk-landing-page:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: sdk-landing-page
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - solusi-digital-khatulistiwa

networks:
  solusi-digital-khatulistiwa:
    external: true
